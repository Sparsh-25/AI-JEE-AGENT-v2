<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI JEE Study Agent</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #000000;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #000;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border: 1px solid #000;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 15px;
  }
  .user {
    align-self: flex-end;
    background: #000;
    color: #fff;
  }
  .bot {
    align-self: flex-start;
    background: #fff;
    color: #000;
  }
  .bot.pending {
    color: #555;
    border-style: dashed;
  }
  form {
    display: flex;
    border-top: 1px solid #000;
    padding: 12px;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #000;
    font-size: 15px;
    background: #fff;
    color: #000;
  }
  input:focus {
    outline: 1px solid #000;
  }
  button {
    padding: 10px 18px;
    background: #000;
    color: #fff;
    border: 1px solid #000;
    cursor: pointer;
    font-size: 15px;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>AI JEE Study Agent</header>
<div id="chat"></div>
<form id="form">
  <input id="input" type="text" placeholder="Ask a JEE question..." autocomplete="off" />
  <button type="submit" id="send">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;

  addMessage(query, 'user');
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;

  const pending = addMessage('Thinking... (can take 10-15s)', 'bot pending');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) {
      throw new Error('server returned ' + res.status);
    }

    const data = await res.json();
    pending.textContent = data.answer;
    pending.classList.remove('pending');
  } catch (err) {
    pending.textContent = 'Error: could not reach the agent (' + err.message + ')';
    pending.classList.remove('pending');
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
